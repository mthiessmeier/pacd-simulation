repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy src tests
        language: system
        pass_filenames: false
