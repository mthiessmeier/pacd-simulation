[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "pacd-simulation"
version = "0.1.0"
description = "Bounded non-reportable PACD simulation diagnostic environment"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "License pending; private repository" }
authors = [{ name = "Michael Thiessmeier" }]
dependencies = [
  "matplotlib>=3.10",
  "networkx>=3.4",
  "numpy>=2.2",
  "pandas>=2.2",
  "pyarrow>=19",
  "pydantic>=2.10",
  "pyyaml>=6.0.2",
  "scipy>=1.15",
  "simpy>=4.1",
]

[project.scripts]
pacd-sim = "pacd_sim.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.8",
  "detect-secrets>=1.5",
  "hypothesis>=6.130",
  "mypy>=1.15",
  "pip-audit>=2.8",
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "pacd_sim"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "networkx.*", "pandas.*", "pyarrow.*", "scipy.*", "simpy.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "negative: fail-closed safety and security behavior",
  "property: property-based invariants",
  "reproducibility: deterministic replay and hashing",
  "scenario: bounded diagnostic scenario behavior",
]

[tool.coverage.run]
branch = true
source = ["pacd_sim"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = []
